<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cinema OS</title>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Archivo+Black&family=Monoton&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: black; margin: 0; overflow: hidden; cursor: none; color: white; font-family: sans-serif; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 1.5s ease-in-out forwards; }

        /* The Slow Zoom (Ken Burns) Effect */
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        .ken-burns {
            animation: slowZoom 20s linear forwards;
        }

        /* Static CRT Grid */
        .crt-grid {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
        
        /* Marquee Styling */
        .cinema-marquee {
            font-family: 'Monoton', cursive;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.6);
            border: 4px dotted #ffcc00;
            padding: 15px 30px;
            display: inline-block;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; background-color: black; display: flex; align-items: center; justify-content: center;">
            <h1 style="color: #dc2626; font-size: 2rem; font-family: 'Share Tech Mono', monospace; letter-spacing: 0.2em; animation: pulse 2s infinite;">
                BOOTING CINEMA OS...
            </h1>
        </div>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('import call expects')) return; 
            var rootDiv = document.getElementById('root');
            if (rootDiv && rootDiv.innerHTML.includes('BOOTING CINEMA OS')) {
                rootDiv.innerHTML = '<div style="padding:40px; color:#ff00de; font-family:\'Share Tech Mono\', monospace; text-align:center; margin-top:20vh;"><h2>FATAL SYSTEM FAULT</h2><p style="color:white;">' + e.message + '</p></div>';
            }
        });

        Babel.registerPreset('react-classic', {
            presets: [ [Babel.availablePresets['react'], { "runtime": "classic" }] ]
        });
    </script>

    <script type="text/babel" data-presets="react-classic">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useRef, useCallback } = React;

        const FilmIcon = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>;
        const AlertCircleIcon = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;

        const TMDB_API_KEY = "6ae71efb7a4441efb04f3b77764589c3"; 
        const GOOGLE_SHEET_PUBLISHED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpYGbkD2AliFONt-zZz2wXOHXR1z6nHRdnF00KW-e66JwK18f_NIXtYp0cGC1s1JzeIG3UznGt6b0w/pubhtml"; 

        const Clock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            return (
                <div className="absolute bottom-12 left-16 font-mono text-5xl font-bold tracking-widest text-white/50 z-40 drop-shadow-lg" style={{fontFamily: "'Share Tech Mono', monospace"}}>
                    {time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                </div>
            );
        };

        const App = () => {
            const [movies, setMovies] = useState([]);
            const [activeMovie, setActiveMovie] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [isDetailsOpen, setIsDetailsOpen] = useState(false);
            const [showVideo, setShowVideo] = useState(false); 
            const [dominantColor, setDominantColor] = useState('rgba(255,255,255,0.5)'); 

            const masterSheetRef = useRef([]);
            const isDetailsOpenRef = useRef(false);
            
            useEffect(() => {
                isDetailsOpenRef.current = isDetailsOpen;
                if (isDetailsOpen) {
                    window.history.pushState({ modalOpen: true }, '');
                    
                    const videoTimer = setTimeout(() => {
                        setShowVideo(true);
                    }, 1500);
                    return () => clearTimeout(videoTimer);
                } else {
                    setShowVideo(false);
                }
            }, [isDetailsOpen]);

            useEffect(() => {
                window.history.pushState("trapped", "");
                const handlePopState = () => {
                    if (isDetailsOpenRef.current) setIsDetailsOpen(false);
                    window.history.pushState("trapped", ""); 
                };

                const handleKeyDown = (e) => {
                    const isBackKey = e.keyCode === 4 || e.keyCode === 27 || e.keyCode === 8 || e.keyCode === 10009 || e.keyCode === 461 || e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack';
                    if (isBackKey) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (isDetailsOpenRef.current) setIsDetailsOpen(false);
                        return;
                    }
                    if (!isDetailsOpenRef.current && (e.keyCode === 13 || e.key === 'Enter' || e.keyCode === 179)) {
                        setIsDetailsOpen(true);
                    }
                };
                
                window.addEventListener('popstate', handlePopState);
                window.addEventListener('keydown', handleKeyDown, true); 
                
                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    window.removeEventListener('keydown', handleKeyDown, true);
                };
            }, []);

            useEffect(() => {
                if (!activeMovie || !activeMovie.backdrop_path) return;
                
                const img = new Image();
                img.crossOrigin = 'Anonymous'; 
                img.src = `https://image.tmdb.org/t/p/w300${activeMovie.backdrop_path}`; 
                
                img.onload = () => {
                    try {
                        const colorThief = new ColorThief();
                        const color = colorThief.getColor(img);
                        setDominantColor(`rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.8)`);
                    } catch (e) {
                        setDominantColor('rgba(255,255,255,0.5)'); 
                    }
                };
            }, [activeMovie]);

            const fetchSheetData = useCallback(async () => {
                try {
                    const url = GOOGLE_SHEET_PUBLISHED_URL.replace(/\/pubhtml.*/, '/pub?output=csv');
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Google Sheets rejected the connection.");
                    
                    const csvText = await response.text();
                    const parsedRows = [];
                    let quote = false;
                    let row = 0, col = 0;
                    for (let c = 0; c < csvText.length; c++) {
                        let cc = csvText[c], nc = csvText[c+1];
                        parsedRows[row] = parsedRows[row] || [];
                        parsedRows[row][col] = parsedRows[row][col] || '';
                        if (cc === '"' && quote && nc === '"') { parsedRows[row][col] += cc; ++c; continue; }
                        if (cc === '"') { quote = !quote; continue; }
                        if (cc === ',' && !quote) { ++col; continue; }
                        if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                        if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                        if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                        parsedRows[row][col] += cc;
                    }

                    return parsedRows.map(r => ({
                        title: r[0]?.trim(), 
                        collectionInfo: r[1]?.trim() || null, 
                    })).filter(m => m.title && m.title.toLowerCase() !== 'title' && m.title.toLowerCase() !== 'name');
                } catch (err) {
                    setError("Database Connection Error: " + err.message);
                    return [];
                }
            }, []);

            const fetchTMDBData = async (movieTitle) => {
                if (!TMDB_API_KEY) return null;
                try {
                    const searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movieTitle)}`;
                    const res = await fetch(searchUrl);
                    if (!res.ok) return null; 
                    
                    const data = await res.json();
                    const movie = data.results[0];
                    if (!movie) return null;

                    const detailUrl = `https://api.themoviedb.org/3/movie/${movie.id}?api_key=${TMDB_API_KEY}&append_to_response=images,videos`;
                    const detailRes = await fetch(detailUrl);
                    
                    if (!detailRes.ok) return movie; 
                    
                    const details = await detailRes.json();
                    const trailer = details.videos?.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube');

                    return {
                        ...movie,
                        logo: details.images?.logos?.find(l => l.iso_639_1 === 'en' || !l.iso_639_1)?.file_path,
                        trailerKey: trailer ? trailer.key : null,
                        fullDetails: details
                    };
                } catch (err) {
                    return null;
                }
            };

            const loadBatch = async (allMovies) => {
                if (!allMovies || allMovies.length === 0) return;
                const shuffled = [...allMovies].sort(() => 0.5 - Math.random());
                const batch = shuffled.slice(0, 40);
                
                const enriched = await Promise.all(
                    batch.map(async (m) => {
                        const tmdb = await fetchTMDBData(m.title);
                        return tmdb ? { ...m, ...tmdb } : null;
                    })
                );
                
                const valid = enriched.filter(m => m !== null);
                
                if (valid.length > 0) {
                    setMovies(valid);
                    if (!isDetailsOpenRef.current) {
                        setActiveMovie(valid[Math.floor(Math.random() * valid.length)]);
                    }
                }
                return valid;
            };

            useEffect(() => {
                const bootOS = async () => {
                    setLoading(true);
                    const sheetMovies = await fetchSheetData();
                    masterSheetRef.current = sheetMovies;
                    
                    const validMovies = await loadBatch(sheetMovies);
                    if ((!validMovies || validMovies.length === 0) && sheetMovies.length > 0) {
                        setError("TMDB Servers are currently experiencing an outage.");
                    }
                    setLoading(false);
                };
                bootOS();
            }, [fetchSheetData]);

            useEffect(() => {
                const refreshTimer = setInterval(() => {
                    if (isDetailsOpenRef.current) return;
                    if (masterSheetRef.current.length > 0) {
                        loadBatch(masterSheetRef.current);
                    }
                }, 600000); 
                return () => clearInterval(refreshTimer);
            }, []);

            useEffect(() => {
                if (movies.length <= 1 || isDetailsOpen) return;
                const interval = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * movies.length);
                    setActiveMovie(movies[randomIndex]);
                }, 15000); 
                return () => clearInterval(interval);
            }, [movies, isDetailsOpen]);

            if (error) return (
                <div className="h-screen bg-black flex flex-col items-center justify-center text-white p-10 text-center font-sans">
                    <AlertCircleIcon size={64} className="text-red-500 mb-4" />
                    <h2 className="text-2xl font-bold mb-2 tracking-widest uppercase">Database Error</h2>
                    <p className="text-gray-400 max-w-md">{error}</p>
                </div>
            );

            if (loading) return (
                <div className="h-screen bg-black flex items-center justify-center text-white font-sans">
                    <div className="animate-pulse flex flex-col items-center">
                        <FilmIcon size={64} className="mb-4 text-red-600" />
                        <p className="text-2xl tracking-[0.3em] uppercase font-black text-red-600" style={{fontFamily: "'Share Tech Mono', monospace"}}>Opening Vault...</p>
                    </div>
                </div>
            );

            return (
                <div className="h-screen w-screen bg-black overflow-hidden relative font-sans text-white">
                    
                    <div className="absolute inset-0 transition-opacity duration-1000 animate-fade-in" key={`bg-${activeMovie?.id}`}>
                        <img 
                            src={`https://image.tmdb.org/t/p/original${activeMovie?.backdrop_path}`}
                            className="w-full h-full object-cover opacity-60 ken-burns"
                            alt=""
                        />
                        <div className="absolute inset-0 bg-gradient-to-r from-black via-black/40 to-transparent" />
                    </div>

                    <div className="absolute inset-0 crt-grid z-30" />

                    {/* Bottom Left Clock */}
                    {!isDetailsOpen && <Clock />}

                    {/* TOP RIGHT LOGO */}
                    {!isDetailsOpen && (
                        <div className="absolute top-12 right-16 z-40 flex flex-col items-end opacity-75 drop-shadow-2xl animate-fade-in">
                            {/* If your logo is an image, delete the <h2> tags below and uncomment this <img> tag: */}
                            {/* <img src="YOUR_LOGO_URL_HERE.png" alt="Robert's Video Store" className="h-16 object-contain" /> */}
                            
                            <h2 className="text-2xl font-black italic uppercase tracking-tighter text-red-600" style={{fontFamily: "'Archivo Black', sans-serif", textShadow: "0 0 10px rgba(220, 38, 38, 0.8)"}}>
                                ROBERT'S
                            </h2>
                            <h2 className="text-2xl font-black italic uppercase tracking-tighter text-red-600 leading-none" style={{fontFamily: "'Archivo Black', sans-serif", textShadow: "0 0 10px rgba(220, 38, 38, 0.8)"}}>
                                VIDEO STORE
                            </h2>
                        </div>
                    )}

                    {!isDetailsOpen && (
                        <div className="relative z-20 h-full flex flex-col justify-center p-16 animate-fade-in" key={`ui-${activeMovie?.id}`}>
                            <div className="max-w-4xl w-full">
                                
                                {activeMovie?.logo ? (
                                    <img 
                                        src={`https://image.tmdb.org/t/p/w500${activeMovie.logo}`}
                                        className="h-56 w-auto max-w-full mb-4 object-contain object-left transition-all duration-1000"
                                        style={{ filter: `drop-shadow(0 0 20px ${dominantColor})` }}
                                        alt="logo"
                                    />
                                ) : (
                                    <h1 className="text-7xl mb-4 cinema-marquee" style={{boxShadow: `0 0 30px ${dominantColor}`}}>
                                        {activeMovie?.title}
                                    </h1>
                                )}
                                
                                <div className="flex flex-wrap gap-3 mb-8 ml-2">
                                    {activeMovie?.fullDetails?.genres?.slice(0, 3).map(g => (
                                        <span key={g.id} className="px-3 py-1 bg-black/70 border border-white/30 text-white/90 text-sm font-bold tracking-widest uppercase rounded">
                                            {g.name}
                                        </span>
                                    ))}
                                </div>
                                
                                <div className="flex items-center space-x-4 bg-black/60 border border-white/20 backdrop-blur-md w-fit px-6 py-3 rounded-full animate-pulse ml-2">
                                    <div className="w-4 h-4 rounded-full" style={{ backgroundColor: dominantColor.replace('0.8', '1') }} />
                                    <span className="text-xl font-bold tracking-[0.2em] uppercase text-white/90">Press OK for Details</span>
                                </div>
                                
                            </div>
                        </div>
                    )}

                    {isDetailsOpen && (
                        <div className="absolute inset-0 z-50 bg-black/95 flex flex-row animate-fade-in">
                            <div className="w-1/3 h-full p-16 flex flex-col justify-center border-r border-white/10 bg-black z-10 relative">
                                <h2 className="text-4xl font-black tracking-tighter uppercase mb-2 text-white" style={{fontFamily: "'Archivo Black', sans-serif"}}>
                                    {activeMovie?.title}
                                </h2>
                                
                                <div className="flex items-center space-x-3 mb-8 text-sm font-bold tracking-widest text-gray-400">
                                    <span className="text-white">{activeMovie?.release_date?.split('-')[0]}</span>
                                    <span>•</span>
                                    <span>{activeMovie?.fullDetails?.genres?.map(g => g.name).slice(0, 2).join(', ')}</span>
                                </div>
                                
                                <p className="text-xl text-gray-300 leading-relaxed mb-12">
                                    {activeMovie?.overview}
                                </p>
                                
                                <div className="mt-auto flex items-center space-x-4 text-gray-500 font-bold uppercase tracking-widest">
                                    <div className="border-2 border-gray-500 px-3 py-1 rounded-full text-sm">BACK</div>
                                    <span>To Return</span>
                                </div>
                            </div>
                            
                            <div className="w-2/3 h-full flex items-center justify-center bg-black relative">
                                {activeMovie?.trailerKey ? (
                                    showVideo ? (
                                        <iframe 
                                            className="w-full h-full"
                                            style={{ backgroundColor: 'black', border: 'none', position: 'relative', zIndex: 1 }}
                                            src={`https://www.youtube.com/embed/${activeMovie.trailerKey}?autoplay=1&controls=1&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3`} 
                                            title="Trailer" 
                                            frameBorder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowFullScreen
                                        ></iframe>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center text-red-600 animate-pulse opacity-60">
                                            <FilmIcon size={64} className="mb-4" />
                                            <p className="text-xl tracking-[0.3em] uppercase font-black" style={{fontFamily: "'Share Tech Mono', monospace"}}>Warming Up Projector...</p>
                                        </div>
                                    )
                                ) : (
                                    <div className="text-center">
                                        <AlertCircleIcon size={64} className="mx-auto text-gray-600 mb-4" />
                                        <p className="text-2xl text-gray-500 font-mono tracking-widest uppercase">No Vault Transmission</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
